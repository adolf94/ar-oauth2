name: Publish Python Auth Client

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.5) - leave empty to use pyproject.toml'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Update version (if override provided)
        if: ${{ inputs.version != '' }}
        run: |
          cd ar-auth-client-python
          # Strip "v" prefix if present for the actual python version
          RAW_VERSION="${{ inputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          sed -i "s/^version = .*/version = \"${CLEAN_VERSION}\"/" pyproject.toml

      - name: Build package
        run: |
          cd ar-auth-client-python
          python -m build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.version }}
          files: ar-auth-client-python/dist/*
