[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-auth-client"
version = "0.2.0"
description = "A Python client and token verification library for ar-auth"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "PyJWT[crypto]>=2.4.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.60.0",
]
flask = [
    "flask>=1.0",
]
azure = [
    "azure-functions>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.6.0",
    "fastapi>=0.60.0",
    "flask>=1.0",
    "azure-functions>=1.0.0",
]
